name: Build kernel, payload and boot image

# Builds everything that needs macOS or a full EDK II toolchain, on a GitHub runner, and uploads
# the three artefacts the phone needs:
#   kernel.macho   the prelinked XNU the payload carries
#   payload.img    the FAT volume UniXNU reads its configuration and the kernel from
#   boot.img       the Android boot image for `fastboot boot`
#
# The firmware volume (SILICIUM_UEFI.fd) is built here too, from a Mu-Silicium checkout that this
# workflow patches with the LG judyp overlay (overlay/Mu-Silicium) and finalises with
# device/scripts/make-judyp-uefi.py, so no local Mac or Linux box is needed.
#
# This repository is the judyp bring-up tree, so the device-specific values below (overlay path,
# destination of the Binaries mirror, prebuild script, device tree, output directory and artefact
# names) are judyp's. enchilada's equivalents are the upstream UniXNU-enchilada-bringup workflow.

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: Defconfig name (configs/ of this repository)
        required: true
        default: judyp_defconfig
      xcode:
        description: Xcode version of the macos-26 image (/Applications/Xcode_<version>.app)
        required: true
        default: "26.6"
      unixnu_ref:
        description: UniXNU ref to build against (empty = its default branch)
        required: false
        default: ""
      mu_silicium_ref:
        description: Mu-Silicium ref (empty = its default branch)
        required: false
        # fb4efb37 is the tree E39/E40's firmware was built from. Its decompressed FVMAIN is
        # 6,606,856 bytes; main had grown to 8,986,632 by the time the CI started building from it,
        # and that firmware dies in DXE with `Out of Resources` (TzDxe/FzDxe assert in
        # UncachedMemoryAllocationLib.c) before any of our drivers run. Pin first, bisect later.
        default: "fb4efb37b4ac289ce83ad94c7acb73defb87955c"
      unique_chip_id:
        description: >-
          Platform seed for the Apple device tree, 16 hex digits. Leave empty to use the
          UNIXNU_UNIQUE_CHIP_ID secret; it is never committed to the repository.
        required: false
        default: ""
      skip_payload:
        description: Build only the kernel (skips the payload and boot image)
        required: false
        type: boolean
        default: false
      build_userdata:
        description: >-
          Also build the iPadOS userdata disk image. Downloads the whole IPSW and
          writes an 8.7 GiB image, so it adds roughly half an hour and a large
          artifact; only needed for the step after the kernel boots.
        required: false
        type: boolean
        default: false
      data_seed_run_id:
        description: >-
          Run id of a "Data seed" workflow whose data-seed-linux artifact should be put on the
          payload as the writable Data volume. Leave empty for a read-only first boot. The seed's
          APFS volume UUID has to equal CONFIG_XNU_OWNER_DATA_VOLUME_UUID of the defconfig, or the
          kernel panics in load_init_program before launchd -- the build checks this.
        required: false
        default: ""
      skip_setup:
        description: >-
          Mark Setup as done in the Data seed so the Hello pages are skipped. Needs data_seed_run_id.
        required: false
        type: boolean
        default: false
      seed_warm:
        description: >-
          Reuse the seed prelink that the restore step falls back to instead of building one. Only
          for a round that changes kernel code without changing which archives the kernel pulls in:
          a print in a driver, a tweak inside one of the device patches. The prelink report the audit
          reads does not depend on that, so the previous round's seed is still accurate. Saves the
          seed build, which is a full kernel build in disguise (the longest single step of a round).
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.defconfig }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      DEFCONFIG: ${{ inputs.defconfig }}
    steps:
      - name: Check out UniXNU (public upstream)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: ${{ inputs.unixnu_ref }}
          persist-credentials: false

      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: device

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -f device/board.toml ] || fail "the device repository has no board.toml"
          [ -f "device/configs/$DEFCONFIG" ] || fail "device/configs/$DEFCONFIG not found"
          [ -d "$DEVELOPER_DIR" ] || fail "Xcode not found at $DEVELOPER_DIR"
          [ -f device/scripts/make-judyp-uefi.py ] || fail "device/scripts/make-judyp-uefi.py missing"
          [ -d device/overlay/Mu-Silicium/Platforms/LG/judypPkg ] || fail "the judyp overlay is missing"
          # DarwinBoot provides gUniXNULoaderProtocolGuid, and [payload] loader = "firmware" means
          # UniXNU finds it in the firmware volume rather than on the payload volume. Check it here,
          # before the three-hour kernel build, rather than in the step that needs it.
          [ -f device/scripts/build-darwinboot.sh ] || fail "device/scripts/build-darwinboot.sh missing"

      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      # The overlay is what makes the build work: upstream Mu-Silicium has no LG platform package, so
      # Platforms/LG/judypPkg, Resources/Configs/judyp.toml, Resources/DTBs/judyp.dts and the
      # Silicium-ACPI LG platform all arrive from device/overlay/Mu-Silicium. The Binaries submodule is
      # not optional either: judypPkg names its vendor DXE drivers under Binaries/judyp (LG's own
      # aboot images), and the checkout only ships Binaries/enchilada, so that tree is mirrored.
      # --shallow-submodules keeps the checkout to a single commit per submodule; the archives are
      # still the full size.
      - name: Check out Mu-Silicium and apply the judyp overlay
        run: |
          # A pin may be a commit, and --branch only accepts branches and tags, so fetch explicitly.
          git init -q ../Mu-Silicium
          git -C ../Mu-Silicium remote add origin https://github.com/Project-Silicium/Mu-Silicium
          git -C ../Mu-Silicium fetch --depth 1 origin "${MU_REF:-HEAD}"
          git -C ../Mu-Silicium checkout -q FETCH_HEAD
          git -C ../Mu-Silicium submodule update --init --recursive --depth 1
          cp -r device/overlay/Mu-Silicium/Platforms \
                device/overlay/Mu-Silicium/Resources \
                device/overlay/Mu-Silicium/Silicium-ACPI ../Mu-Silicium/
          cp -r ../Mu-Silicium/Binaries/enchilada ../Mu-Silicium/Binaries/judyp
          python3 device/scripts/make-judyp-uefi.py ../Mu-Silicium
        env:
          MU_REF: ${{ inputs.mu_silicium_ref }}

      - name: Verify the Qualcomm vendor binaries are present
        run: |
          files=$(find ../Mu-Silicium/Binaries/judyp -name '*.efi' 2>/dev/null | wc -l)
          echo "Binaries/judyp: $files .efi file(s)"
          if [ "$files" -lt 30 ]; then
            echo "::error::the Binaries submodule is empty; the EDK II build cannot link the platform"
            git -C ../Mu-Silicium submodule status Binaries || true
            exit 1
          fi

      - name: Select the device
        run: ./unixnu defconfig "$DEFCONFIG" -D "$GITHUB_WORKSPACE/device"

      - name: Fetch sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./unixnu fetch

      # The device repository's patches/xnu/ replaces UniXNU's shared series in the assembled tree
      # instead of adding to it, so the board's patches live in patches/xnu-device/ and this
      # composes the directory the format 1 build globs. Without it the kernel is built with the
      # board's two patches and none of the shared sixty, and nothing fails here -- it fails on the
      # phone. --check then proves the composed directory is what both halves say it should be.
      - name: Compose the XNU patch series
        run: |
          python3 device/scripts/compose-xnu-patches.py --write --unixnu "$GITHUB_WORKSPACE"
          python3 device/scripts/compose-xnu-patches.py --unixnu "$GITHUB_WORKSPACE"

      # Runners are disposable, so there are no Docker layers to reuse. actions/cache is the equivalent:
      # the key is a hash of the inputs, and a rerun that touches nothing they depend on restores the
      # directory instead of rebuilding it. The two heaviest fixed costs are cached here; the compile
      # itself is not, because XNU's build has no incremental support across machines.
      #
      # Layer 1: the IPSW components only change when the [ipsw] pin in board.toml changes.
      - name: Restore the fetched IPSW components
        uses: actions/cache@v4
        with:
          path: out/ipsw
          key: ipsw-${{ hashFiles('device/board.toml') }}
          restore-keys: |
            ipsw-

      # Two inputs the kernel step needs before it starts: the pinned kernelcache (prelink) and the OS /
      # SystemOS envelopes that build-enchilada-verified-root.py hashes. Neither is part of the default
      # [ipsw] fetch list, which only names the small components. The audit is here because the seed
      # build below has no prelink yet; audit-storage-interface-static.py accepts the pinned kernelcache
      # itself with --slide, its addresses being module-relative.
      - name: Fetch the IPSW components the kernel archives need
        run: |
          ./unixnu ipsw fetch KernelCache
          ./unixnu ipsw fetch OS Cryptex1,SystemOS
          kc=$(ls out/ipsw/*/kernelcache.decompressed | head -1)
          [ -f "$kc" ] || { echo "::error::no decompressed kernelcache in out/ipsw"; exit 1; }
          # The archive stages it with Path(candidate).with_suffix('.macho'), so it must be named *.macho.
          cand="${kc%.decompressed}.macho"
          cp "$kc" "$cand"
          pre=$(dirname "$(find "$GITHUB_WORKSPACE" -name native_prelink.py -print -quit)")
          [ -n "$pre" ] || { echo "::error::native_prelink.py not found"; exit 1; }
          PYTHONPATH="$pre:${PYTHONPATH:-}" \
            python3 device/scripts/audit-storage-interface-static.py \
              --prelinked "$cand" --slide=-0x1000000 --out device/build/storage-abi
          echo "kernelcache audit: $(wc -c < "$cand") bytes"

      # Every archive that audits a prelink (PMGR, display, the probes) reads a *prelink report*, which
      # is a product of a finished build -- so a from-scratch build has nothing to audit. The way out is
      # a throwaway seed build whose only job is to produce that report:
      #   * it drops those archives and the two XNU_* features they alone provide;
      #   * libBootProgress still references the probe symbols they define, so a seed-only stub archive
      #     (clearly named, never shipped) satisfies the link;
      #   * the storage archive audits the pinned kernelcache, which it already accepts.
      # The seed prelinks against the same kernelcache, leaving out-seed/kernel.macho + kernel.json --
      # the pair every dropped archive audits in the real build below.
      # Layer 2: the seed prelink is a full kernel build in disguise, so caching it removes the largest
      # fixed cost of a rerun. The key covers every input the prelink depends on -- the configs, the
      # board file, the board's own sources and patches, the UEFI overlay -- plus the refs and Xcode.
      - name: Restore the seed prelink
        id: seedcache
        uses: actions/cache@v4
        with:
          path: out-seed
          key: seed-${{ hashFiles('device/configs/**', 'device/board.toml', 'device/kits/**', 'device/package/**', 'device/patches/**', 'device/overlay/**', 'device/scripts/**') }}-${{ inputs.unixnu_ref }}-${{ inputs.xcode }}
          restore-keys: |
            seed-

      - name: Build a seed kernel for the prelink audits
        if: steps.seedcache.outputs.cache-hit != 'true' && !inputs.seed_warm
        env:
          UNIXNU_UEFI: ${{ github.workspace }}/../Mu-Silicium
          # prepare-xnu-source.py runs inside the bootstrap pass and calls the GitHub API for the
          # DriverKit headers. Anonymous calls share a small per-address quota that hosted runners
          # exhaust, so the seed fails with "HTTP Error 403: rate limit exceeded" without a token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cp device/board.toml /tmp/board.toml.device
          python3 - <<'PY'
          import os
          import pathlib
          import re

          root = pathlib.Path('device')
          off = {'XNU_SHENG_PMGR', 'XNU_NATIVE_LEGACY_DISPLAY'}
          # The stub archive lives outside the build tree, so it is named absolutely; {tree} would not
          # resolve for a plain archives entry anyway.
          extra = ('-Wl,-force_load,{tree}/build/enchilada-dwc3/libNativeDwc3.a '
                   f"-Wl,-force_load,{os.environ['GITHUB_WORKSPACE']}/build/seed-stubs/libSeedStubs.a")
          out = []
          for line in (root / 'configs/judyp_defconfig').read_text().splitlines():
              m = re.match(r'CONFIG_(\w+)=', line)
              if m and m.group(1) in off:
                  out.append(f'CONFIG_{m.group(1)}=n')
              elif m and m.group(1) == 'XNU_EXTRA_LD_ARCHIVES':
                  out.append(f'CONFIG_XNU_EXTRA_LD_ARCHIVES="{extra}"')
              else:
                  out.append(line)
          (root / 'configs/judyp_seed_defconfig').write_text('\n'.join(out) + '\n')

          drop = ('build-sheng-platform-power.py', 'build-native-legacy-display.py',
                  'build-enchilada-touch.py', 'build-enchilada-cpufreq.py',
                  'build-enchilada-msm-dsi.py', 'build-enchilada-gauge.py',
                  'build-enchilada-smmu.py', 'build-enchilada-adreno.py')
          lines = (root / 'board.toml').read_text().splitlines()
          start = next(i for i, l in enumerate(lines) if l.strip() == 'archives = [')
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == ']')
          kept = [l for l in lines[start + 1:end]
                  if l.strip().startswith('"') and not any(k in l for k in drop)]
          (root / 'board.toml').write_text('\n'.join(lines[:start + 1] + kept + lines[end:]) + '\n')
          print('seed archives:', len(kept))
          PY
          # The probe symbols libBootProgress imports. The identifiers carry NO leading underscore:
          # Mach-O already prefixes every C symbol with one, so "_native_..." in C would define
          # "__native_..." and the reference would stay unresolved.
          mkdir -p build/seed-stubs
          {
            echo 'int enchilada_adreno_poll(void) { return 0; }'
            echo 'int enchilada_gauge_poll(void) { return 0; }'
            echo 'int enchilada_smmu_poll(void) { return 0; }'
            echo 'int sheng_pmgr_run(void) { return 0; }'
            echo 'long native_legacy_late_color_counts = 0;'
            echo 'long native_legacy_late_colors = 0;'
            echo 'long native_legacy_late_count = 0;'
            echo 'long native_legacy_late_stats = 0;'
            echo 'long native_legacy_late_time = 0;'
          } > build/seed-stubs/seed_stubs.c
          clang -target arm64-apple-ios17 -fno-common -c -o build/seed-stubs/seed_stubs.o build/seed-stubs/seed_stubs.c
          ar rcs build/seed-stubs/libSeedStubs.a build/seed-stubs/seed_stubs.o
          ./unixnu defconfig judyp_seed_defconfig -D "$GITHUB_WORKSPACE/device"
          ENCHILADA_STORAGE_CANDIDATE="$GITHUB_WORKSPACE/$(ls out/ipsw/*/kernelcache.macho)" \
          ENCHILADA_STORAGE_AUDIT="$GITHUB_WORKSPACE/device/build/storage-abi/interface-audit.json" \
            ./unixnu build kernel -D "$GITHUB_WORKSPACE/device"

          # Copy the seed out of the build output before the real build overwrites out/judyp/kernel.
          mkdir -p "$GITHUB_WORKSPACE/out-seed"
          cp out/judyp/kernel/kernel.macho "$GITHUB_WORKSPACE/out-seed/kernel.macho"
          cp out/judyp/kernel/kernel.json "$GITHUB_WORKSPACE/out-seed/kernel.json"
          cp /tmp/board.toml.device device/board.toml
          seed="$GITHUB_WORKSPACE/out-seed/kernel.macho"
          test -f "$seed"
          test -f "${seed%.macho}.json"
          echo "seed prelink: $seed ($(wc -c < "$seed") bytes)"
          # The real build takes the seed as ENCHILADA_STORAGE_CANDIDATE: the archives after the storage
          # one (PMGR, touch, ...) read its prelink report. The storage ABI audit cannot qualify a prelink
          # that [kernel.prelink] slide rebased, so it keeps the pinned-kernelcache audit made above and
          # only cross-checks that report against the kernelcache.
          echo "ENCHILADA_STORAGE_CANDIDATE=$seed" >> "$GITHUB_ENV"
          echo "ENCHILADA_STORAGE_AUDIT=$GITHUB_WORKSPACE/device/build/storage-abi/interface-audit.json" >> "$GITHUB_ENV"
          echo "ENCHILADA_STORAGE_AUDIT_CANDIDATE=$GITHUB_WORKSPACE/$(ls out/ipsw/*/kernelcache.macho)" >> "$GITHUB_ENV"
          ./unixnu defconfig judyp_defconfig -D "$GITHUB_WORKSPACE/device"

      # Runs whether the seed was just built or came from the cache: the kernel build reads these three
      # variables, and a cache hit skips the step that writes them.
      - name: Publish the seed prelink to the kernel build
        run: |
          seed="$GITHUB_WORKSPACE/out-seed/kernel.macho"
          test -f "$seed" || { echo "::error::no seed prelink in out-seed"; exit 1; }
          test -f "${seed%.macho}.json" || { echo "::error::no prelink report next to the seed"; exit 1; }
          echo "seed prelink: $seed ($(wc -c < "$seed") bytes)"
          echo "ENCHILADA_STORAGE_CANDIDATE=$seed" >> "$GITHUB_ENV"
          echo "ENCHILADA_STORAGE_AUDIT=$GITHUB_WORKSPACE/device/build/storage-abi/interface-audit.json" >> "$GITHUB_ENV"
          echo "ENCHILADA_STORAGE_AUDIT_CANDIDATE=$GITHUB_WORKSPACE/$(ls out/ipsw/*/kernelcache.macho)" >> "$GITHUB_ENV"

      - name: Build kernel
        id: kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # build-native-legacy-display.py compiles against Mu-Silicium's graphics console headers
          # (Font.h) and finds them only through this variable; without it it looks under "." and stops.
          UNIXNU_UEFI: ${{ github.workspace }}/../Mu-Silicium
        run: ./unixnu build kernel

      - name: Build DarwinBoot
        id: darwinboot
        run: |
          chmod +x device/scripts/build-darwinboot.sh
          device/scripts/build-darwinboot.sh DEBUG
          cp out/darwinboot/DarwinBoot.efi /tmp/DarwinBoot.efi

      - name: Resolve the platform seed
        if: ${{ !inputs.skip_payload }}
        run: |
          seed="${{ inputs.unique_chip_id }}"
          if [ -z "$seed" ]; then
            seed="${UNIXNU_UNIQUE_CHIP_ID:-}"
          fi
          if [ -z "$seed" ]; then
            # A fixed seed is only a placeholder for a first console boot: it is not a secret and it is
            # not derived from the phone. Replace it with the value from
            # `device/scripts/dump-device-facts.sh` once the phone has been read.
            seed=00000000$(printf '%08x' $(( RANDOM * RANDOM )))
            echo "::warning::no platform seed given; using the disposable seed $seed"
          fi
          echo "UNIXNU_UNIQUE_CHIP_ID=$seed" >> "$GITHUB_ENV"
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}

      - name: Fetch the Data seed
        id: seed
        if: ${{ !inputs.skip_payload && inputs.data_seed_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: data-seed-linux
          path: /tmp/data-seed
          run-id: ${{ inputs.data_seed_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The seed's volume UUID is compiled into the kernel, and a mismatch is a panic in
      # load_init_program rather than a fallback, so it is checked here instead of on the phone.
      - name: Check the Data seed against the kernel
        id: seedcheck
        if: ${{ !inputs.skip_payload && inputs.data_seed_run_id != '' }}
        run: |
          configured=$(grep -E '^CONFIG_XNU_OWNER_DATA_VOLUME_UUID=' device/configs/*defconfig | head -1 | cut -d'"' -f2)
          python3 - "$configured" <<'PY'
          import json, sys
          expected = sys.argv[1].upper()
          report = json.load(open('/tmp/data-seed/data-linux.json'))
          actual = str(report['volume_uuid']).upper()
          print('seed volume_uuid:', actual)
          print('kernel compiled for:', expected)
          print('seed role:', report.get('role'))
          if actual != expected:
              raise SystemExit(
                  f'the seed carries {actual} but the kernel was compiled for {expected}; '
                  'load_init_program would panic("offline scratch Data mount failed") before launchd')
          if report.get('role') not in (None, [], ['None'], 'none'):
              raise SystemExit(f'the seed carries role {report["role"]}; iOS panics on an unencrypted Data-role volume')
          print('the seed matches the kernel')
          PY

      - name: Build payload
        id: payload
        if: ${{ !inputs.skip_payload }}
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ env.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          args=""
          if [ -n "${{ inputs.data_seed_run_id }}" ]; then
            args="$args --data-ramdisk /tmp/data-seed/data-linux.dbr"
            if [ "${{ inputs.skip_setup }}" = "true" ]; then
              args="$args --skip-setup"
            fi
          fi
          # shellcheck disable=SC2086
          ./unixnu build payload $args

      # board.toml says loader = "firmware", so the DarwinBoot that installs the loader protocol is
      # built into the firmware volume and UniXNU never looks for it on the FAT volume. The copy
      # below is the fallback route: with loader = "payload" payload.py writes a [[driver]] section
      # that makes UniXNU load Payloads/DarwinBoot.efi from the volume instead, and that file has to
      # be staged by hand because the payload build only copies the kernel, the ADT and the data
      # seed. Keeping it here means the fallback needs a rebuild of the payload, not a new step.
      - name: Stage DarwinBoot on the payload volume for the loader = "payload" fallback
        if: ${{ !inputs.skip_payload && steps.payload.outcome == 'success' && steps.darwinboot.outcome == 'success' }}
        run: |
          mcopy -i out/*/payload/payload.img /tmp/DarwinBoot.efi ::/EFI/UniXNU/Payloads/DarwinBoot.efi
          echo "staged DarwinBoot.efi on the payload volume"

      - name: Build UniXNU package and firmware volume
        id: firmware
        env:
          # The board preflight (scripts/check-judyp.py) is a subprocess of this step and has to
          # find the patched Mu-Silicium checkout; give it the absolute path so it does not depend on
          # the working directory it is invoked from.
          UNIXNU_UEFI: ${{ github.workspace }}/../Mu-Silicium
        run: ./unixnu build package firmware --uefi ../Mu-Silicium

      # Two images: judyp's measured route is the payload on a partition of its own (system_a/b) with
      # an empty ramdisk in the boot image, because the initrd window the ABL reserves is about 18 MiB
      # and the payload volume is 144 MiB (board.toml [payload]). boot.img with the payload as its
      # ramdisk is built anyway as the alternative, and only ever tried second.
      #
      # They go into separate directories because bootimg.py writes boot.json next to the image: with
      # both images in one directory the second overwrites the first's report, and the report is the
      # only record of which firmware volume and device tree went into which image.
      - name: Pack the boot images
        id: bootimg
        run: |
          ./unixnu bootimg --uefi ../Mu-Silicium \
            --dtb ../Mu-Silicium/Resources/DTBs/judyp.dtb \
            -o out/judyp/boot/with-ramdisk/boot.img
          ./unixnu bootimg --uefi ../Mu-Silicium \
            --dtb ../Mu-Silicium/Resources/DTBs/judyp.dtb \
            --ramdisk none -o out/judyp/boot/no-ramdisk/boot.img
          # upload-artifact rejects any path with '..' in it ("Relative pathing '.' and '..' is not
          # allowed"), so the firmware volume the images were packed from is copied inside the
          # workspace and uploaded from there.
          cp ../Mu-Silicium/Build/judypPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd out/judyp/boot/SILICIUM_UEFI.fd

      - name: Build the userdata image
        id: userdata
        if: ${{ inputs.build_userdata }}
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ env.UNIXNU_UNIQUE_CHIP_ID }}
        run: ./unixnu build userdata

      - name: Upload kernel
        if: always() && steps.kernel.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: judyp-kernel
          path: |
            out/*/kernel/kernel.macho
            out/*/kernel/*.log
          if-no-files-found: error
          retention-days: 7

      - name: Upload payload
        if: always() && steps.payload.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: judyp-payload
          path: |
            out/*/payload/payload.img
            out/*/payload/payload.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload boot image and firmware volume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judyp-bootimg
          path: |
            out/judyp/boot/with-ramdisk/boot.img
            out/judyp/boot/with-ramdisk/boot.json
            out/judyp/boot/no-ramdisk/boot.img
            out/judyp/boot/no-ramdisk/boot.json
            out/judyp/boot/SILICIUM_UEFI.fd
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judyp-logs
          path: out/*/logs/*.log
          if-no-files-found: warn
          retention-days: 7
